<!doctype html>
<html lang="en">
    <head>
        <title>Site Maintenance</title>
        <meta charset="utf-8" />
        <meta name="robots" content="noindex" />
        <meta
            name="viewport"
            content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
        />
        <meta name="color-scheme" content="light dark" />
        <style>
            :root {
                --bg: #f4f1eb;
                --surface: #ffffff;
                --ink: #17181b;
                --ink-soft: #64666d;
                --line: rgba(23, 24, 27, 0.14);
                --accent: #315cf5;
                --accent-dark: #2448cc;
                --shadow: rgba(23, 24, 27, 0.12);
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #151617;
                    --surface: #202124;
                    --ink: #f4f1eb;
                    --ink-soft: #adaeb3;
                    --line: rgba(255, 255, 255, 0.13);
                    --accent: #7391ff;
                    --accent-dark: #9bb0ff;
                    --shadow: rgba(0, 0, 0, 0.32);
                }
            }

            * {
                box-sizing: border-box;
            }

            body {
                display: grid;
                min-height: 100vh;
                margin: 0;
                padding: 24px;
                place-items: center;
                color: var(--ink);
                background: var(--bg);
                font-family:
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    Helvetica,
                    Arial,
                    sans-serif;
                line-height: 1.6;
            }

            article {
                width: min(100%, 620px);
                padding: clamp(28px, 6vw, 48px);
                border: 1px solid var(--line);
                border-radius: 12px;
                background: var(--surface);
                box-shadow: 0 28px 70px var(--shadow);
            }

            .badge {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                margin: 0 0 18px;
                color: var(--accent);
                font-size: 0.75rem;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
            }

            .badge::before {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: currentColor;
                box-shadow: 0 0 0 5px rgba(49, 92, 245, 0.16);
                content: '';
            }

            h1 {
                margin: 0 0 14px;
                font-size: clamp(2rem, 6vw, 2.75rem);
                line-height: 1.1;
                letter-spacing: -0.01em;
            }

            p {
                margin: 0 0 20px;
                color: var(--ink-soft);
                font-size: 1.05rem;
            }

            img {
                display: block;
                max-width: 100%;
                height: auto;
                margin: 8px 0 24px;
                border-radius: 8px;
            }

            a {
                color: var(--accent);
                font-weight: 600;
                text-decoration: underline;
                text-decoration-color: transparent;
                text-underline-offset: 3px;
                transition:
                    color 0.2s ease,
                    text-decoration-color 0.2s ease;
            }

            a:hover {
                color: var(--accent-dark);
                text-decoration-color: currentColor;
            }

            a:focus-visible {
                border-radius: 4px;
                outline: 3px solid rgba(49, 92, 245, 0.35);
                outline-offset: 2px;
            }

            .signature {
                margin: 0;
                padding-top: 18px;
                border-top: 1px solid var(--line);
                font-size: 0.95rem;
            }
        </style>
    </head>

    <body>
        <main>
            <article>
                <p class="badge">Scheduled maintenance</p>
                <h1>We&rsquo;ll be back soon!</h1>
                <p>
                    Sorry for the inconvenience but we&rsquo;re performing some maintenance at the moment. If you need
                    to you can always
                    <a href="mailto:miroslav.pejic.85@gmail.com">contact us</a>, otherwise we&rsquo;ll be back online
                    shortly!
                </p>
                <img src="https://media.giphy.com/media/dWesBcTLavkZuG35MI/giphy.gif" alt="Maintenance in progress" />
                <p class="signature">&mdash; The MiroTalk Team</p>
            </article>
        </main>
    </body>
    <!--  
	# Under maintenance custom page
	error_page 500 502 503 504 /50X.html;
	location = /maintenance.html {
		root /usr/share/nginx/html;
		internal;
	}
	-->
</html>
