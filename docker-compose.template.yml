services:
    mirotalkc2c:
        image: mirotalk/c2c:latest
        container_name: mirotalkc2c
        hostname: mirotalkc2c
        # Run as non-root (uid:gid). The image already defaults to the non-root
        # "node" user (1000:1000); set this to override with a different uid/gid.
        user: '1000:1000'
        restart: unless-stopped
        ports:
            - '${PORT}:${PORT}'
        volumes:
            - .env:/src/.env:ro
            # Optional volumes for real-time updates:
            # - ./frontend/:/src/frontend/:ro
            # - ./backend/:/src/backend/:ro
